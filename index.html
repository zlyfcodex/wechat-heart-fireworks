<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030006">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>爱心烟花文字 · 实时运行监视器</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020004;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { position: fixed; inset: 0; }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #bg { z-index: 0; }
  #trail { z-index: 1; }
  #fx { z-index: 2; }
  #blackout {
    position: fixed;
    inset: 0;
    z-index: 30;
    pointer-events: none;
    background: #000;
    opacity: 0;
    transition: opacity 5s linear;
  }
  #blackout.active { opacity: 1; }
  #code-atmosphere {
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    bottom: 0;
    width: 48%;
    overflow: hidden;
    pointer-events: none;
    opacity: .26;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 68%, transparent 100%);
    mask-image: linear-gradient(90deg, #000 0%, #000 68%, transparent 100%);
  }
  #code-atmosphere-track {
    padding: 28px 18px;
    animation: none; transform: translate3d(0,0,0);
    will-change: transform;
  }
  #code-atmosphere-track.finish {
    animation-duration: 1.1s;
    animation-iteration-count: 1;
    animation-fill-mode: forwards;
  }
  .code-bg-line {
    display: flex;
    gap: 10px;
    align-items: baseline;
    min-height: 17px;
    color: rgba(243, 214, 234, .56);
    font: 500 10px/1.7 ui-monospace, Menlo, Consolas, monospace;
    white-space: nowrap;
  }
  .code-bg-line .n {
    width: 23px;
    flex: none;
    text-align: right;
    color: rgba(255, 176, 218, .32);
  }
  .code-bg-line code { font: inherit; }
  @keyframes codeDrift {
    from { transform: translateY(-5%); }
    to { transform: translateY(-48%); }
  }
  #sound {
    position: fixed;
    z-index: 40;
    top: max(14px, env(safe-area-inset-top));
    right: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 13px;
    border: 1px solid rgba(255, 168, 219, .34);
    border-radius: 999px;
    background: linear-gradient(150deg, rgba(38, 11, 34, .86), rgba(9, 2, 12, .92));
    color: rgba(255, 228, 244, .94);
    font: 600 11px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .08em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 0 20px rgba(255, 57, 158, .14);
  }
  #sound span { pointer-events: none; }
  #sound #sound-icon { font-size: 12px; color: #ff9bd2; text-shadow: 0 0 10px rgba(255, 80, 175, .8); }
  #sound.started { padding: 8px 10px; animation: none; opacity: .78; }
  #sound.started #sound-text { display: none; }
  #sound.off { opacity: .44; }
  #sound.off #sound-icon { color: rgba(255, 226, 242, .55); text-shadow: none; }
  #sound:active { transform: scale(.95); }
  #sound:not(.started) { animation: soundPulse 2.6s ease-in-out infinite; }
  @keyframes soundPulse {
    0%, 100% { box-shadow: 0 0 16px rgba(255, 57, 158, .12); }
    50% { box-shadow: 0 0 26px rgba(255, 57, 158, .32); }
  }
  #monitor {
    position: fixed;
    z-index: 6;
    top: auto;
    right: 18px;
    bottom: max(18px, env(safe-area-inset-bottom));
    width: min(236px, calc(100vw - 24px));
    height: 196px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    pointer-events: none;
    border: 1px solid rgba(255, 164, 216, .26);
    border-radius: 18px;
    background:
      linear-gradient(145deg, rgba(31, 9, 31, .86), rgba(6, 2, 10, .94)),
      rgba(5, 1, 8, .92);
    box-shadow:
      0 28px 80px rgba(0, 0, 0, .58),
      0 0 44px rgba(255, 57, 158, .13),
      inset 0 1px 0 rgba(255, 255, 255, .05);
    backdrop-filter: blur(18px) saturate(145%);
    -webkit-backdrop-filter: blur(18px) saturate(145%);
  }
  #monitor::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    background: linear-gradient(110deg, rgba(255,255,255,.045), transparent 28%, transparent 72%, rgba(255,120,190,.035));
  }
  #monitor-head {
    height: 30px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    border-bottom: 1px solid rgba(255, 166, 218, .14);
    background: rgba(255, 255, 255, .018);
  }
  .dots { display: flex; gap: 5px; }
  .dots i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255, 185, 224, .26);
  }
  .dots i:first-child { background: #ff78b9; box-shadow: 0 0 10px rgba(255, 86, 171, .75); }
  #monitor-title {
    flex: 1;
    color: rgba(255, 225, 241, .78);
    font: 600 8.5px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .16em;
    white-space: nowrap;
  }
  #live {
    display: flex;
    align-items: center;
    gap: 5px;
    color: rgba(255, 215, 236, .72);
    font: 600 7.5px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .12em;
  }
  #live span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ff6bb7;
    box-shadow: 0 0 12px rgba(255, 84, 172, .95);
    animation: livePulse 1.15s ease-in-out infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: .45; transform: scale(.76); }
    50% { opacity: 1; transform: scale(1); }
  }
  #monitor-body {
    flex: 1;
    min-height: 0;
    display: flex;
  }
  #code-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 7px 9px 6px;
    background: rgba(5, 1, 8, .58);
  }
  #code-head {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    color: rgba(255, 187, 224, .52);
    font: 600 7px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .1em;
  }
  #line-status { color: rgba(255, 214, 237, .4); }
  #telemetry {
    flex: none;
    display: flex;
    justify-content: space-between;
    gap: 6px;
    margin-top: 3px;
    color: rgba(255, 213, 235, .58);
    font: 700 6px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .05em;
    text-shadow: 0 0 8px rgba(255, 55, 158, .45);
  }
  #code-viewport {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    margin-top: 3px;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 10%, #000 90%, transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 10%, #000 90%, transparent);
  }
  #code-viewport::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 39%;
    z-index: 3;
    height: 13px;
    pointer-events: none;
    border-left: 1px solid rgba(255, 104, 183, .9);
    background: linear-gradient(90deg, rgba(255, 66, 166, .17), rgba(255, 66, 166, .03), transparent);
    box-shadow: 0 0 14px rgba(255, 57, 158, .18);
    animation: executeScan 1.2s ease-in-out infinite;
  }
  @keyframes executeScan {
    0%, 100% { transform: translateY(-1px); opacity: .72; }
    50% { transform: translateY(1px); opacity: 1; }
  }
  #code-track {
    position: relative;
    z-index: 2;
    will-change: transform;
  }
  .code-line {
    display: flex;
    gap: 5px;
    align-items: baseline;
    min-height: 13px;
    padding: 0 2px;
    border-left: 1px solid transparent;
    color: rgba(255, 226, 242, .34);
    font: 500 7.2px/1.5 ui-monospace, Menlo, Consolas, monospace;
    white-space: nowrap;
    transition: color .12s ease, background .12s ease, border-color .12s ease;
  }
  .code-line .ln {
    width: 13px;
    flex: none;
    color: rgba(255, 178, 219, .2);
    text-align: right;
  }
  .code-line code { font: inherit; }
  .tok-kw { color: #ff89c7; }
  .tok-fn { color: #caa9ff; }
  .tok-str { color: #ffd2e8; }
  .tok-num { color: #ffe6a8; }
  .tok-op { color: #8bd9ff; }
  .tok-com { color: rgba(255, 180, 215, .44); font-style: italic; }
  .tok-punc { color: rgba(255, 220, 240, .48); }
  .code-line.active {
    color: #fff4fa;
    border-left-color: #ff72ba;
    background: linear-gradient(90deg, rgba(255, 88, 173, .17), rgba(255, 88, 173, .015));
    text-shadow: 0 0 12px rgba(255, 78, 170, .68);
  }
  .code-line.active .ln { color: #ff85c4; }
  .code-line.active code::after {
    content: '▌';
    margin-left: 2px;
    color: #ff8ac5;
    animation: cursorBlink .7s steps(1) infinite;
  }
  #terminal {
    flex: none;
    margin-top: 3px;
    padding-top: 3px;
    border-top: 1px solid rgba(255, 166, 218, .12);
    overflow: hidden;
    color: rgba(255, 193, 226, .6);
    font: 600 5.8px/1.3 ui-monospace, Menlo, Consolas, monospace;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  #terminal .cursor {
    margin-left: 3px;
    color: #ff83c5;
    animation: cursorBlink .8s steps(1) infinite;
  }
  @keyframes cursorBlink { 50% { opacity: 0; } }
  #code-progress {
    flex: none;
    height: 1px;
    margin-top: 4px;
    overflow: hidden;
    background: rgba(255, 255, 255, .07);
  }
  #code-progress i {
    display: block;
    width: 0;
    height: 100%;
    background: linear-gradient(90deg, #ff4da6, #ffd4ea);
    box-shadow: 0 0 8px rgba(255, 80, 170, .8);
  }
  @media (max-width: 760px) {
    #code-atmosphere { width: 100%; opacity: .2; }
    #code-atmosphere-track { padding: 18px 10px; }
    .code-bg-line { min-height: 13px; font-size: 7px; }
    #monitor {
      left: auto;
      right: 10px;
      top: auto;
      bottom: max(10px, env(safe-area-inset-bottom));
      width: min(200px, calc(100vw - 20px));
      height: 142px;
      border-radius: 12px;
    }
    #monitor-head {
      height: 28px;
      padding: 0 8px;
      gap: 6px;
    }
    .dots { gap: 3px; }
    .dots i { width: 5px; height: 5px; }
    #monitor-title { font-size: 7px; letter-spacing: .1em; }
    #live { font-size: 6px; }
    #code-wrap { padding: 4px 5px 3px; }
    #code-head { font-size: 5.8px; }
    #telemetry { font-size: 5.2px; margin-top: 2px; }
    .code-line {
      gap: 3px;
      min-height: 10px;
      font-size: 6.1px;
      line-height: 1.35;
      padding: 0 1px;
    }
    .code-line .ln { width: 10px; }
    #code-viewport { margin-top: 2px; }
    #code-viewport::before { height: 11px; }
    #terminal { margin-top: 2px; padding-top: 2px; font-size: 5.2px; }
    #code-progress { margin-top: 2px; }
  }
  @media (max-height: 520px) {
    #monitor {
      width: min(190px, calc(100vw - 20px));
      height: 120px;
    }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="trail" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="code-atmosphere" aria-hidden="true"><div id="code-atmosphere-track"></div></div>
<div id="blackout" aria-hidden="true"></div>
<button id="sound" type="button" aria-label="背景音乐开关"><span id="sound-icon">♪</span><span id="sound-text">划一下开启音乐</span></button>
<aside id="monitor" aria-label="实时运行监视器">
  <div id="monitor-head">
    <div class="dots"><i></i><i></i><i></i></div>
    <div id="monitor-title">BIRTHDAY CODE</div>
    <div id="live"><span></span>LIVE</div>
  </div>
  <div id="monitor-body">
    <div id="code-wrap">
      <div id="code-head">
        <span>birthday_letter.js</span>
        <span id="line-status">L01/27</span>
      </div>
      <div id="telemetry">
        <span id="phase-label">BOOT</span>
        <span id="fps-label">60 FPS</span>
        <span id="particle-label">0 P</span>
      </div>
      <div id="code-viewport"><div id="code-track"></div></div>
      <div id="terminal"><span id="terminal-text">&gt; canvas.init()</span><span class="cursor">_</span></div>
      <div id="code-progress"><i id="code-progress-fill"></i></div>
    </div>
  </div>
</aside>
<script>
(function () {
  'use strict';
  /* ===== 只改这里：姓名与祝福段落 ===== */
  var CONFIG = {
    name: '祝',
    blessings: [
      '我的小猪',
      '生日快乐',
      'o(*￣▽￣*)ブ'
    ],
    enableMusic: true,    // ← 音乐总开关：false = 完全不放音乐（按钮也会隐藏）
    loop: true,           // ← 播完一遍后自动重播（false 则停在黑屏）
    /* 背景音乐优先级：
       ① musicUrl 指定的文件；
       ② 同目录自动探测：music.mp3 → music.m4a → music.ogg；
       ③ 都没有 → 用内置的原创爵士圆舞曲（代码合成，无版权问题）。
       当前目录里放的是 music.m4a（Star Crossing Night，Apple 官方 30 秒试听）。
       想换歌：把新文件改名成 music.mp3 覆盖即可。 */
    musicUrl: ''
  };
  /* ==================================== */
  var bg = document.getElementById('bg');
  var fx = document.getElementById('fx');
  var bgCtx = bg.getContext('2d');
  var ctx = fx.getContext('2d');
  var trail = document.getElementById('trail');
  var tctx = trail.getContext('2d');
  var textCanvas = document.createElement('canvas');
  var textCtx = textCanvas.getContext('2d');
  var monitor = document.getElementById('monitor');
  var phaseLabel = document.getElementById('phase-label');
  var fpsLabel = document.getElementById('fps-label');
  var particleLabel = document.getElementById('particle-label');
  var terminalText = document.getElementById('terminal-text');
  var lineStatus = document.getElementById('line-status');
  var progressFill = document.getElementById('code-progress-fill');
  var codeViewport = document.getElementById('code-viewport');
  var codeTrack = document.getElementById('code-track');
  var codeAtmosphere = document.getElementById('code-atmosphere');
  var codeAtmosphereTrack = document.getElementById('code-atmosphere-track');
  var blackout = document.getElementById('blackout');
  var codeLineNodes = [];
  var w = 0;
  var h = 0;
  var dpr = 1;
  var trailDpr = 1;
  var stage = { cx: 0, cy: 0, w: 0, h: 0 };
  var heart = { cx: 0, cy: 0, scale: 1 };
  var stars = [];
  var particles = [];
  var current = null;
  var rocket = null;
  var messageIndex = 0;
  var phase = 'heartLaunch';
  var phaseStart = 0;
  var lastTime = 0;
  var maxParticles = 2200;
  var ROCKET_GRAVITY = 520;
  var HEART_FORM_TIME = 8000;
  var HEART_BURST_TIME = 620;
  var HEART_REFORM_TIME = 3000;
  var MESSAGE_LIFE = 2000;
  var FONT_FAMILY = '"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif';
  var KAOMOJI_FONT = '"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","MS Gothic","Apple Symbols","Arial Unicode MS",sans-serif';
  var messages = [{ text: CONFIG.name, kind: 'name' }];
  for (var mi = 0; mi < CONFIG.blessings.length; mi++) {
    messages.push({ text: CONFIG.blessings[mi], kind: 'blessing' });
  }
  var smoothFps = 60;
  var monitorClock = 0;
  var lastRunningLine = 0;
  var codeStartedAt = 0;
  var lastBaseEmit = 0;
  var lastWispEmit = 0;
  var chaosUntil = 0;
  var outroStarted = false;
  var PALETTE = [
    { r: 255, g: 82, b: 166 },
    { r: 255, g: 133, b: 198 },
    { r: 255, g: 180, b: 221 },
    { r: 255, g: 229, b: 246 }
  ];
  var CODE_LINES = [
    "/* birthday_letter.js */",
    "const to = \"我的小猪\";",
    "const wish = [\"祝\", \"我的小猪\", \"生日快乐\", \"o(*￣▽￣*)ブ\"];",
    "const palette = [\"#ffd6e0\", \"#ff9fce\", \"#fff1f8\"];",
    "",
    "function heart(t) {",
    "  // 想你的形状，是一颗不会消失的爱心",
    "  const x = 16 * Math.pow(Math.sin(t), 3);",
    "  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t);",
    "  return { x: centerX + x * scale, y: centerY - y * scale };",
    "}",
    "",
    "function launch(color) {",
    "  // 从底部升空，在夜空里爆开",
    "  return rocket.fromBottom().burst(color);",
    "}",
    "",
    "function write(text) {",
    "  // 让每一颗粒子，都飞向这句话",
    "  particles.morphTo(text);",
    "  hold(1000).then(() => particles.fadeOut());",
    "}",
    "",
    "wish.forEach((text, index) => {",
    "  launch(palette[index % palette.length]);",
    "  write(text, index, performance.now());",
    "});"
  ];
  function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
  }
  function easeOut(t) {
    return 1 - Math.pow(1 - t, 3);
  }
  function bezier(a, b, c, t) {
    var u = 1 - t;
    return u * u * a + 2 * u * t * b + t * t * c;
  }
  function fontString(size, weight, family) {
    return (weight || 500) + ' ' + size + 'px ' + (family || FONT_FAMILY);
  }
  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function highlightCode(line) {
    var tokenRegex = /(\/\*.*?\*\/|\/\/[^\n]*|\b(?:const|let|var|function|return|for|if|else|requestAnimationFrame)\b|\b[A-Za-z_$][\w$]*(?=\s*\()|'[^']*'|"[^"]*"|#[0-9a-fA-F]{3,8}|\b\d+(?:\.\d+)?\b|=>|[=+\-*/<>(){}[\],.;:])/g;
    var result = '';
    var last = 0;
    var match;
    while ((match = tokenRegex.exec(line))) {
      result += escapeHtml(line.slice(last, match.index));
      var token = match[0];
      var cls = 'tok-punc';
      if (/^\/[/*]/.test(token)) {
        cls = 'tok-com';
      } else if (/^(const|let|var|function|return|for|if|else|requestAnimationFrame)$/.test(token)) {
        cls = 'tok-kw';
      } else if (/^['"]/.test(token)) {
        cls = 'tok-str';
      } else if (/^#/.test(token) || /^\d/.test(token)) {
        cls = 'tok-num';
      } else if (/^[=+\-*/<>]$/.test(token) || token === '=>') {
        cls = 'tok-op';
      } else if (/^[A-Za-z_$]/.test(token)) {
        cls = 'tok-fn';
      }
      result += '<span class="' + cls + '">' + escapeHtml(token) + '</span>';
      last = match.index + token.length;
    }
    result += escapeHtml(line.slice(last));
    return result || '&nbsp;';
  }
  function buildCodeAtmosphere() {
    codeAtmosphereTrack.innerHTML = '';
    for (var pass = 0; pass < 4; pass++) {
      for (var i = 0; i < CODE_LINES.length; i++) {
        var row = document.createElement('div');
        var lineNo = document.createElement('span');
        var codeNode = document.createElement('code');
        row.className = 'code-bg-line';
        lineNo.className = 'n';
        lineNo.textContent = String(i + 1).padStart(2, '0');
        codeNode.innerHTML = highlightCode(CODE_LINES[i]);
        row.appendChild(lineNo);
        row.appendChild(codeNode);
        codeAtmosphereTrack.appendChild(row);
      }
    }
  }
  function buildCodeViewer() {
    codeTrack.innerHTML = '';
    codeLineNodes.length = 0;

    for (var i = 0; i < CODE_LINES.length; i++) {
      var row = document.createElement('div');
      var lineNo = document.createElement('span');
      var codeNode = document.createElement('code');

      row.className = 'code-line';
      row.setAttribute('data-index', String(i));
      lineNo.className = 'ln';
      lineNo.textContent = String(i + 1).padStart(2, '0');
      codeNode.innerHTML = highlightCode(CODE_LINES[i]);
      row.appendChild(lineNo);
      row.appendChild(codeNode);
      codeTrack.appendChild(row);
      codeLineNodes.push(row);
    }
  }

  function updateRunningCode(now) {
    var rows = CODE_LINES.length;
    var lineHeight = codeTrack.scrollHeight
      ? codeTrack.scrollHeight / rows
      : 15;

    if (!isFinite(lineHeight) || lineHeight < 7) lineHeight = 15;

    var viewportHeight = codeViewport.clientHeight || 120;
    var totalHeight = lineHeight * rows;
    var maxOffset = Math.max(0, totalHeight - viewportHeight + lineHeight);
    var elapsed = Math.max(0, now - codeStartedAt);
    var offset = Math.min(elapsed * .001 * 56, maxOffset);
    var progress = maxOffset > 0 ? offset / maxOffset : 1;
    var active = progress >= .999
      ? rows - 1
      : Math.min(
          rows - 1,
          Math.floor((offset + viewportHeight * .42) / lineHeight)
        );

    lastRunningLine = active;
    codeTrack.style.transform = 'translate3d(0,' + (-offset) + 'px,0)';
    lineStatus.textContent = 'L' + String(active + 1).padStart(2, '0') + '/' + rows;
    progressFill.style.width = (progress * 100).toFixed(1) + '%';

    for (var i = 0; i < codeLineNodes.length; i++) {
      var node = codeLineNodes[i];
      node.classList.toggle(
        'active',
        Number(node.getAttribute('data-index')) === active
      );
    }
  }

  function heartPoint(t) {
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x: heart.cx + x * heart.scale, y: heart.cy - y * heart.scale };
  }

  function heartPulse(now) {
    var cycle = 2100;
    var p = (now % cycle) / cycle;
    var first = Math.exp(-Math.pow((p - .09) / .09, 2));
    var second = .56 * Math.exp(-Math.pow((p - .27) / .11, 2));
    return first + second;
  }

  function projectHeart3D(x, y, z, now, noBeat) {
    var spin = Math.sin(now * .00042) * .16;
    var pulse = heartPulse(now);
    var beat = noBeat ? 1 : 1 + .075 * pulse + .008 * Math.sin(now * .0007);
    var tilt = -.10 + Math.sin(now * .00035) * .04;
    var cs = Math.cos(spin);
    var sn = Math.sin(spin);
    var ct = Math.cos(tilt);
    var st = Math.sin(tilt);
    var x1 = x * cs + y * sn;
    var y1 = -x * sn + y * cs;
    var z1 = z * ct - y1 * st;
    var y2 = y1 * ct + z * st;
    var perspective = 1 / (1 - y2 / 58);
    return {
      x: heart.cx + x1 * heart.scale * perspective * beat,
      y: heart.cy - z1 * heart.scale * perspective * beat,
      depth: clamp(.32 + (y2 + 7) / 14, .12, 1)
    };
  }

  function resize() {
    w = window.innerWidth;
    h = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    [bg, fx].forEach(function (canvas) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
    });
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    trailDpr = Math.min(dpr, 1);
    trail.width = Math.round(w * trailDpr);
    trail.height = Math.round(h * trailDpr);
    trail.style.width = w + 'px';
    trail.style.height = h + 'px';
    tctx.setTransform(trailDpr, 0, 0, trailDpr, 0, 0);
    tctx.globalCompositeOperation = 'lighter';
    tctx.clearRect(0, 0, w, h);

    var monitorRect = monitor.getBoundingClientRect ? monitor.getBoundingClientRect() : { width: 236, height: 196 };
    var wide = w >= 900;
    stage.w = wide ? Math.max(420, w - monitorRect.width - 60) : w;
    stage.h = h;
    stage.cx = wide ? 24 + stage.w * .5 : w * .5;
    stage.cy = h * .44;
    heart.scale = Math.min(stage.w / 42, h / 40);
    heart.cx = stage.cx;
    heart.cy = stage.cy;

    buildStars();
    buildVortices();
    drawBackground();
    ctx.clearRect(0, 0, w, h);
    restart(performance.now());
  }

  function buildStars() {
    stars.length = 0;
    var count = Math.round(Math.min(210, Math.max(75, w * h / 6500)));
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h * .88,
        r: .2 + Math.random() * 1.15,
        a: .1 + Math.random() * .5
      });
    }
  }

  function drawBackground() {
    bgCtx.clearRect(0, 0, w, h);
    var grad = bgCtx.createRadialGradient(w * .5, h * .42, 0, w * .5, h * .46, Math.max(w, h) * .78);
    grad.addColorStop(0, '#130514');
    grad.addColorStop(.36, '#07030d');
    grad.addColorStop(1, '#010002');
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, w, h);
    bgCtx.save();
    bgCtx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      bgCtx.beginPath();
      bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      bgCtx.fillStyle = 'rgba(255,228,246,' + s.a + ')';
      bgCtx.fill();
    }
    bgCtx.restore();
  }

  /* ===== 星海流光：流场涡旋 + 长曝光丝带拖尾（颜色与背景沿用原样） ===== */
  var vortices = [];
  var flowOut = { x: 0, y: 0 };
  var TRAIL_FADE = .03;      // 拖尾每帧衰减（.03 ≈ 1.2 秒记忆）
  var TRAIL_FADE_QUICK = .095;// 非丝带阶段（文字/散场）的快速衰减
  var TRAIL_FADE_FLUSH = .22; // 爱心炸开瞬间的快速擦拭
  var trailDecay = .03;      // 当前这一帧实际使用的衰减量
  var TRAIL_ALPHA = .55;     // 拖尾亮度（相对粒子亮度）
  var TRAIL_WIDTH = 1.15;    // 丝带线宽系数
  var TRAIL_SHARE = .3;      // 拉丝的粒子比例
  var TRAIL_SHARE_FREE = .45;// 升空/爆开的自由粒子拉丝比例
  var HEART_SWIRL_AMP = .2;  // 整颗爱心绕中心摆动幅度（弧度，形状不变，只拉出弧线丝带）
  var HEART_SWIRL_RATE = .0009;  // 摆动速度（弧度/毫秒）
  var CURL_SCALE = 10;        // 局部涡旋的扰动半径（像素）
  var FLOW_DRAG = 240;       // 自由粒子（升空/爆开）受流场的牵引

  function buildVortices() {
    vortices.length = 0;
    var span = Math.min(stage.w, stage.h);
    for (var i = 0; i < 5; i++) {
      var a = i / 5 * Math.PI * 2 + Math.random() * .8;
      var r0 = span * (.15 + Math.random() * .14);
      vortices.push({
        ax: Math.cos(a) * (.18 + Math.random() * .3),
        ay: Math.sin(a) * (.16 + Math.random() * .26),
        phase: Math.random() * Math.PI * 2,
        orbit: .00006 + Math.random() * .00008,
        strength: (Math.random() < .5 ? -1 : 1) * r0 * r0 * .085,
        soft: r0 * r0
      });
    }
  }

  function updateVortices(now) {
    for (var i = 0; i < vortices.length; i++) {
      var v = vortices[i];
      v.x = stage.cx + v.ax * stage.w + Math.cos(now * v.orbit + v.phase) * stage.w * .06;
      v.y = stage.cy + v.ay * stage.h * .8 + Math.sin(now * v.orbit * 1.4 + v.phase) * stage.h * .05;
    }
  }

  function flowAt(x, y, now) {
    var vx = 0;
    var vy = 0;
    for (var i = 0; i < vortices.length; i++) {
      var v = vortices[i];
      var dx = x - v.x;
      var dy = y - v.y;
      var r2 = dx * dx + dy * dy + v.soft;
      var w = v.strength / r2;
      vx -= dy * w;
      vy += dx * w;
    }
    vx += Math.sin(y * .0027 + now * .00023) * .45;
    vy += Math.cos(x * .0022 - now * .0002) * .45;
    var m = Math.sqrt(vx * vx + vy * vy);
    if (m > 1.8) {
      vx = vx / m * 1.8;
      vy = vy / m * 1.8;
    }
    flowOut.x = vx;
    flowOut.y = vy;
    return flowOut;
  }

  /* 拖尾衰减按阶段走：丝带阶段慢衰减拉长尾，其它时刻快衰减 */
  function trailDecayFor(phaseName, elapsed) {
    if (phaseName === 'heartLaunch' || phaseName === 'heartReveal' || phaseName === 'heartReform') return TRAIL_FADE;
    if (phaseName === 'heartFinale') return elapsed < 620 ? TRAIL_FADE_FLUSH : TRAIL_FADE_QUICK;
    return TRAIL_FADE_QUICK;
  }

  function fadeTrail() {
    tctx.save();
    tctx.globalCompositeOperation = 'destination-out';
    tctx.fillStyle = 'rgba(0,0,0,' + trailDecay + ')';
    tctx.fillRect(0, 0, w, h);
    tctx.restore();
  }

  function trailStroke(px, py, x, y, r, g, b, alpha, width) {
    if (px === null || px === undefined) return;
    var dx = x - px;
    var dy = y - py;
    if (dx * dx + dy * dy < .04) return;
    tctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    tctx.lineWidth = width;
    tctx.lineCap = 'round';
    tctx.beginPath();
    tctx.moveTo(px, py);
    tctx.lineTo(x, y);
    tctx.stroke();
  }

  /* 光点：每颗单独画（实测比合批快 3 倍以上 —— 合批会把几千个圆弧塞进同一条路径，反而拖死） */
  function trailHead(x, y, r, g, b, alpha, radius) {
    tctx.beginPath();
    tctx.arc(x, y, radius, 0, Math.PI * 2);
    tctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    tctx.fill();
  }

  function makeParticle(x, y, options) {
    if (particles.length >= maxParticles) particles.shift();
    var color = options.color || PALETTE[Math.floor(Math.random() * PALETTE.length)];
    var angle = options.angle === undefined ? Math.random() * Math.PI * 2 : options.angle;
    var speed = options.speed === undefined ? 35 : options.speed;
    particles.push({
      x: x,
      y: y,
      px: null,
      py: null,
      trailOn: Math.random() < TRAIL_SHARE_FREE,
      vx: Math.cos(angle) * speed + (options.vx || 0),
      vy: Math.sin(angle) * speed + (options.vy || 0),
      gravity: options.gravity === undefined ? 42 : options.gravity,
      drag: options.drag || .98,
      age: 0,
      life: options.life || (.7 + Math.random() * 1.1),
      size: options.size || (.6 + Math.random() * 1.65),
      r: color.r,
      g: color.g,
      b: color.b,
      phase: Math.random() * Math.PI * 2
    });
  }

  function drawParticles(dt, now) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.age += dt;
      if (p.age >= p.life) {
        particles.splice(i, 1);
        continue;
      }
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.gravity * dt;
      var pFlow = flowAt(p.x, p.y, now);
      p.vx += pFlow.x * FLOW_DRAG * dt;
      p.vy += pFlow.y * FLOW_DRAG * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      var k = 1 - p.age / p.life;
      var twinkle = .65 + .35 * Math.sin(p.age * 54 + p.phase);
      var alpha = Math.pow(k, 1.25) * twinkle;
      var radius = p.size * (.5 + k * .8);
      if (p.trailOn) {
        trailStroke(p.px, p.py, p.x, p.y, p.r, p.g, p.b, alpha * TRAIL_ALPHA * .55, Math.max(.6, radius * TRAIL_WIDTH));
        trailHead(p.x, p.y, p.r, p.g, p.b, alpha * .14, Math.max(.5, radius * 2.2));
      }
      p.px = p.x;
      p.py = p.y;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(.15, radius), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + alpha + ')';
      ctx.fill();
      if (radius > 1.2) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius * 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + (alpha * .07) + ')';
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function fitTextStyle(text, centerY, initialSize, maxWidth, maxTargets) {
    var lines = text.split('\n');
    var size = initialSize;
    var isKaomoji = /[▽￣ブ]/.test(text);
    var family = isKaomoji ? KAOMOJI_FONT : FONT_FAMILY;
    textCtx.font = fontString(size, 500, family);
    var widest = 0;
    for (var i = 0; i < lines.length; i++) {
      widest = Math.max(widest, textCtx.measureText(lines[i]).width);
    }
    if (widest > maxWidth) size *= maxWidth / widest;

    var lineHeight = size * 1.48;
    var totalHeight = lineHeight * lines.length;
    var startY = centerY - totalHeight * .5;
    var gap = Math.max(3, Math.round(size * (isKaomoji ? .085 : .12)));
    var targets = [];

    textCanvas.width = w;
    textCanvas.height = h;
    textCtx.clearRect(0, 0, w, h);
    textCtx.font = fontString(size, 500, family);
    textCtx.textAlign = 'center';
    textCtx.textBaseline = 'middle';
    textCtx.fillStyle = '#fff';
    for (var j = 0; j < lines.length; j++) {
      textCtx.fillText(lines[j], stage.cx, startY + lineHeight * (j + .5));
    }

    var pixels = textCtx.getImageData(0, 0, w, h).data;
    for (var y = 0; y < h; y += gap) {
      for (var x = 0; x < w; x += gap) {
        if (pixels[(y * w + x) * 4 + 3] > 80) {
          targets.push({
            x: x + (Math.random() - .5) * gap * .42,
            y: y + (Math.random() - .5) * gap * .42
          });
        }
      }
    }

    if (targets.length > maxTargets) {
      var sampled = [];
      var stride = targets.length / maxTargets;
      for (var k = 0; k < maxTargets; k++) {
        sampled.push(targets[Math.floor(k * stride)]);
      }
      targets = sampled;
    }

    return {
      lines: lines,
      size: size,
      lineHeight: lineHeight,
      centerY: centerY,
      family: family,
      targets: targets
    };
  }

  function buildAssemblies(targets, burstX, burstY, now, color, spread) {
    var list = [];
    for (var i = 0; i < targets.length; i++) {
      var target = targets[i];
      var angle = Math.random() * Math.PI * 2;
      var radius = 12 + Math.random() * spread;
      var sx = burstX + Math.cos(angle) * radius;
      var sy = burstY + Math.sin(angle) * radius;
      var projected = target.x3 === undefined
        ? { x: target.x, y: target.y, depth: target.depth === undefined ? 1 : target.depth }
        : projectHeart3D(target.x3, target.y3, target.z3, now);
      list.push({
        sx: sx,
        sy: sy,
        cx: (sx + projected.x) * .5 + (Math.random() - .5) * 58,
        cy: (sy + projected.y) * .5 + (Math.random() - .5) * 58,
        tx: projected.x,
        ty: projected.y,
        x3: target.x3,
        y3: target.y3,
        z3: target.z3,
        is3d: target.x3 !== undefined,
        startAt: now,
        delay: Math.random() * 420,
        duration: 980 + Math.random() * 520,
        size: .55 + Math.random() * 1.35,
        phase: Math.random() * Math.PI * 2,
        trailOn: Math.random() < TRAIL_SHARE,
        depth: projected.depth,
        color: color
      });
    }
    return list;
  }

  function buildHeartAssemblies(burstX, burstY, now) {
    var targets = [];
    var surfaceTarget = 3100;
    var volumeTarget = 1900;

    for (var i = 0; i < surfaceTarget; i++) {
      var t = Math.random() * Math.PI * 2;
      var edgeX = 16 * Math.pow(Math.sin(t), 3);
      var edgeZ = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      var r = .88 + Math.random() * .12;
      var depth = Math.random() * 2 - 1;
      var thickness = Math.pow(Math.max(0, 1 - depth * depth), .34);
      targets.push({
        x3: edgeX * r * thickness,
        y3: depth * 6.2,
        z3: edgeZ * r * thickness,
        surface: true,
        depth: .70 + Math.random() * .30
      });
    }

    for (var j = 0; j < volumeTarget; j++) {
      var vt = Math.random() * Math.PI * 2;
      var vx = 16 * Math.pow(Math.sin(vt), 3);
      var vz = 13 * Math.cos(vt) - 5 * Math.cos(2 * vt) - 2 * Math.cos(3 * vt) - Math.cos(4 * vt);
      var vr = Math.pow(Math.random(), .55) * .94;
      var vd = Math.random() * 2 - 1;
      var vth = Math.pow(Math.max(0, 1 - vd * vd), .42);
      targets.push({
        x3: vx * vr * vth,
        y3: vd * 5.6,
        z3: vz * vr * vth,
        surface: false,
        depth: .24 + Math.random() * .58
      });
    }

    var list = buildAssemblies(targets, burstX, burstY, now, PALETTE[2], 104);
    for (var k = 0; k < list.length; k++) {
      var surface = list[k].surface === true;
      if (k % 31 === 0) list[k].color = PALETTE[3];
      else if (k % 7 === 0) list[k].color = PALETTE[1];
      list[k].size *= surface
        ? .25 + list[k].depth * .21
        : .11 + list[k].depth * .12;
    }
    return list;
  }

  function drawAssemblies(list, now, fade) {
    if (!list || fade <= 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < list.length; i++) {
      var d = list[i];
      var local = clamp((now - d.startAt - d.delay) / d.duration, 0, 1);
      var k = easeOut(local);
      var targetX = d.tx;
      var targetY = d.ty;
      var targetDepth = d.depth === undefined ? 1 : d.depth;
      var silkTX = targetX;
      var silkTY = targetY;

      if (d.is3d) {
        var projected = projectHeart3D(d.x3, d.y3, d.z3, now);
        targetX = projected.x;
        targetY = projected.y;
        targetDepth = projected.depth;
        var silkProj = projectHeart3D(d.x3, d.y3, d.z3, now, true);
        silkTX = silkProj.x;
        silkTY = silkProj.y;
      }

      var x = bezier(d.sx, d.cx, targetX, k);
      var y = bezier(d.sy, d.cy, targetY, k);
      var silkX = bezier(d.sx, d.cx, silkTX, k);
      var silkY = bezier(d.sy, d.cy, silkTY, k);
      var pulse = d.is3d ? heartPulse(now) : 0;
      if (d.is3d) {
        var jx = Math.sin(now * .0016 + d.phase) * (d.surface ? 2.2 : 1.1);
        var jy = Math.cos(now * .00135 + d.phase * 1.4) * (d.surface ? 2.0 : 1.0);
        x += jx;
        y += jy;
        silkX += jx;
        silkY += jy;
      }
      var twinkle = .68 + .32 * Math.sin(now * .006 + d.phase);
      var depth = targetDepth;
      var surface = d.surface === true;
      /* 星海流光：整颗爱心绕中心缓慢摆动 + 局部涡旋扰动。
         摆动只作用在投影后的位置（形状不变，心形轮廓始终标准）；
         拖尾用的是「去掉心跳高频跳动」的丝带位置，所以拖尾是一条条弧线，
         而不是被心跳扫出来的放射状毛刺。 */
      var dFlow = flowAt(silkX, silkY, now);
      var curl = CURL_SCALE * (surface ? 1 : .55) * (.5 + depth * .7);
      var ox = dFlow.x * curl;
      var oy = dFlow.y * curl;
      if (d.is3d) {
        var swarm = HEART_SWIRL_AMP * Math.sin(now * HEART_SWIRL_RATE + (d.x3 + d.y3 * .5 + d.z3) * .05);
        var cs0 = Math.cos(swarm) - 1;
        var sn0 = Math.sin(swarm);
        var hx0 = silkX - heart.cx;
        var hy0 = silkY - heart.cy;
        ox += hx0 * cs0 - hy0 * sn0;
        oy += hx0 * sn0 + hy0 * cs0;
      }
      x += ox;
      y += oy;
      silkX += ox;
      silkY += oy;
      var alpha = (.28 + .72 * twinkle) * fade * (.36 + depth * .64) * (surface ? 1 : .42) * (1 + pulse * .16);
      var radius = d.size * (.78 + depth * .38) * (1 + Math.sin(Math.PI * local) * .55) * (surface ? 1.12 : .84) * (1 + pulse * (surface ? .14 : .06));
      if (d.trailOn) {
        trailStroke(d.tpx, d.tpy, silkX, silkY, d.color.r, d.color.g, d.color.b, alpha * TRAIL_ALPHA, Math.max(.7, radius * TRAIL_WIDTH));
        trailHead(silkX, silkY, d.color.r, d.color.g, d.color.b, alpha * .14, Math.max(.6, radius * 2.2));
      }
      d.tpx = silkX;
      d.tpy = silkY;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + d.color.r + ',' + d.color.g + ',' + d.color.b + ',' + alpha + ')';
      ctx.fill();
      if (radius > 1.1) {
        ctx.beginPath();
        ctx.arc(x, y, radius * 3.1, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + d.color.r + ',' + d.color.g + ',' + d.color.b + ',' + (alpha * .065) + ')';
        ctx.fill();
      }
    }
    ctx.restore();
  }


  function heartBasePoint() {
    return { x: heart.cx, y: heart.cy + heart.scale * 19.0 };
  }

  /* 在拖尾层上给小猪留一块柔和的干净区域：丝带不会把小猪淹掉 */
  function clearTrailBase() {
    var base = heartBasePoint();
    var pixel = Math.max(2.0, heart.scale * .3);
    var cx = base.x;
    var cy = base.y + pixel * 5.6;
    var r = pixel * 7.6;
    tctx.save();
    tctx.globalCompositeOperation = 'destination-out';
    var g = tctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, 'rgba(0,0,0,.94)');
    g.addColorStop(.58, 'rgba(0,0,0,.5)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    tctx.fillStyle = g;
    tctx.beginPath();
    tctx.arc(cx, cy, r, 0, Math.PI * 2);
    tctx.fill();
    tctx.restore();
  }

  function drawPixelPig(now, strength) {
    strength = clamp(strength, 0, 1);
    if (strength <= 0) return;

    var base = heartBasePoint();
    var pixel = Math.max(2.0, heart.scale * .3);
    var rows = [
      '..##....##..',
      '.##########.',
      '############',
      '##o######o##',
      '##.######.##',
      '##ssssssss##',
      '##s#ssss#s##',
      '##ssssssss##',
      '.##########.'
    ];
    var cols = rows[0].length;
    var height = rows.length;
    var originX = base.x - cols * pixel * .5;
    var originY = base.y + pixel * 1.1;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    ctx.fillStyle = 'rgba(255,55,160,' + (.11 * strength) + ')';
    ctx.fillRect(originX - pixel * 2, originY + height * pixel + pixel, cols * pixel + pixel * 4, pixel * .55);

    /* 小猪背后的柔光：让它在一大团流光里依然读得出来 */
    var gx = originX + cols * pixel * .5;
    var gy = originY + height * pixel * .48;
    var gr = cols * pixel * .8;
    var glow = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    glow.addColorStop(0, 'rgba(255,142,204,' + (.26 * strength) + ')');
    glow.addColorStop(.42, 'rgba(255,70,168,' + (.12 * strength) + ')');
    glow.addColorStop(1, 'rgba(255,20,120,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(gx, gy, gr, 0, Math.PI * 2);
    ctx.fill();

    for (var r = 0; r < height; r++) {
      for (var c = 0; c < cols; c++) {
        var ch = rows[r].charAt(c);
        if (ch === '.') continue;

        var color = ch === 'o'
          ? { r: 220, g: 68, b: 145 }
          : (ch === 's' ? PALETTE[3] : PALETTE[2]);
        var twinkle = .76 + .24 * Math.sin(now * .013 + r * 2.1 + c * 1.7);
        var px = originX + (c + .5) * pixel;
        var py = originY + (r + .5) * pixel + Math.sin(now * .004 + c) * pixel * .06;
        var radius = pixel * (ch === 'o' ? .44 : .38) * twinkle;

        ctx.beginPath();
        ctx.arc(px, py, radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + color.r + ',' + color.g + ',' + color.b + ',' + (.98 * strength * (.84 + .16 * twinkle)) + ')';
        ctx.fill();

        if (radius > .9) {
          ctx.beginPath();
          ctx.arc(px, py, radius * 2.8, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + color.r + ',' + color.g + ',' + color.b + ',' + (.12 * strength) + ')';
          ctx.fill();
        }
      }
    }

    ctx.restore();
  }


  function emitBaseStream(now, strength) {
    if (now - lastBaseEmit < 40) return;
    lastBaseEmit = now;
    var base = heartBasePoint();
    var count = 1 + Math.round(2 * strength);
    for (var i = 0; i < count; i++) {
      var angle = -Math.PI * .5 + (Math.random() - .5) * .92;
      makeParticle(base.x + (Math.random() - .5) * heart.scale * 1.3, base.y + (Math.random() - .5) * 4, {
        angle: angle,
        speed: 28 + Math.random() * 68,
        vx: (Math.random() - .5) * 20,
        life: .8 + Math.random() * 1.3,
        size: .42 + Math.random() * 1.35,
        gravity: -9 - Math.random() * 10,
        drag: .984,
        color: Math.random() < .22 ? PALETTE[3] : PALETTE[2]
      });
    }
  }

  function emitHeartWisps(now, strength) {
    if (!current || !current.assemblies || now - lastWispEmit < 55) return;
    lastWispEmit = now;
    var count = 3 + Math.round(strength * 2);
    var list = current.assemblies;
    for (var i = 0; i < count; i++) {
      var d = list[Math.floor(Math.random() * list.length)];
      if (!d || !d.is3d) continue;
      var p = projectHeart3D(d.x3, d.y3, d.z3, now);
      makeParticle(p.x, p.y, {
        angle: Math.random() * Math.PI * 2,
        speed: 5 + Math.random() * 18,
        life: .5 + Math.random() * 1.2,
        size: .18 + Math.random() * .62,
        gravity: -2,
        drag: .986,
        color: d.color
      });
    }
  }

  function drawTextBlock(style, alpha) {
    if (!style || alpha <= 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha;
    ctx.font = fontString(style.size, 500, style.family);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur = 18;
    ctx.shadowColor = 'rgba(255,126,192,.42)';
    var grad = ctx.createLinearGradient(stage.cx - stage.w * .25, 0, stage.cx + stage.w * .25, 0);
    grad.addColorStop(0, 'rgba(255,190,222,.96)');
    grad.addColorStop(.48, 'rgba(255,222,241,1)');
    grad.addColorStop(1, 'rgba(255,178,214,.96)');
    ctx.fillStyle = grad;
    var startY = style.centerY - style.lineHeight * style.lines.length * .5;
    for (var i = 0; i < style.lines.length; i++) {
      ctx.fillText(style.lines[i], stage.cx, startY + style.lineHeight * (i + .5));
    }
    ctx.restore();
  }

  function startRocket(kind, index, now) {
    var isHeart = kind === 'heart';
    var targetY = isHeart ? heartBasePoint().y : h * .5;
    var color = isHeart ? PALETTE[2] : (messages[index].kind === 'name' ? PALETTE[3] : PALETTE[2]);
    var distance = h + 26 - targetY;
    rocket = {
      kind: kind,
      index: index,
      x: stage.cx + (isHeart ? 0 : (Math.random() - .5) * stage.w * .055),
      y: h + 26,
      vy: -Math.sqrt(2 * ROCKET_GRAVITY * distance),
      gravity: ROCKET_GRAVITY,
      targetY: targetY,
      color: color
    };
    phase = isHeart ? 'heartLaunch' : 'messageLaunch';
    phaseStart = now;
  }

  function explodeAt(x, y, color, count) {
    for (var i = 0; i < count; i++) {
      makeParticle(x, y, {
        angle: Math.random() * Math.PI * 2,
        speed: 42 + Math.random() * 190,
        life: .55 + Math.random() * 1.15,
        size: .6 + Math.random() * 2,
        gravity: 58 + Math.random() * 58,
        drag: .975,
        color: color
      });
    }
  }

  function updateRocket(dt, now) {
    if (!rocket) return;
    rocket.vy += rocket.gravity * dt;
    var oldY = rocket.y;
    rocket.y += rocket.vy * dt;

    var trail = Math.max(3, Math.round(Math.abs(oldY - rocket.y) * .16));
    for (var i = 0; i < trail; i++) {
      makeParticle(rocket.x + (Math.random() - .5) * 3, rocket.y + (Math.random() - .5) * 3, {
        angle: Math.PI * .5 + (Math.random() - .5) * .75,
        speed: 5 + Math.random() * 17,
        life: .28 + Math.random() * .58,
        size: .5 + Math.random() * 1.25,
        gravity: 56,
        drag: .972,
        color: rocket.color
      });
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var r = 11 + Math.sin(now * .028) * 2.5;
    var grad = ctx.createRadialGradient(rocket.x, rocket.y, 0, rocket.x, rocket.y, r);
    grad.addColorStop(0, 'rgba(255,255,255,.98)');
    grad.addColorStop(.18, 'rgba(255,214,239,.9)');
    grad.addColorStop(.48, 'rgba(255,70,171,.42)');
    grad.addColorStop(1, 'rgba(255,20,120,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(rocket.x, rocket.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (rocket.y <= rocket.targetY || rocket.vy >= 0) {
      var x = rocket.x;
      var y = Math.min(rocket.y, rocket.targetY);
      var kind = rocket.kind;
      var index = rocket.index;
      var color = rocket.color;
      rocket = null;
      if (kind === 'heart') {
        explodeAt(x, y, color, 86);
        emitBaseStream(now, 1);
        current = {
          kind: 'heart',
          assemblies: buildHeartAssemblies(x, y, now),
          startAt: now
        };
        phase = 'heartReveal';
      } else {
        explodeAt(x, y, color, 112);
        var isName = messages[index].kind === 'name';
        var size = isName ? Math.min(stage.w * .085, 34) : Math.min(stage.w * .052, 21);
        var style = fitTextStyle(messages[index].text, h * .5, size, stage.w * .82, isName ? 330 : 470);
        current = {
          kind: 'message',
          index: index,
          style: style,
          assemblies: buildAssemblies(style.targets, x, y, now, color, isName ? 70 : 58),
          startAt: now
        };
        phase = 'messageReveal';
      }
      phaseStart = now;
    }
  }

  function explodeHeartAssemblies(list, now) {
    if (!list) return;
    for (var i = 0; i < list.length; i += 2) {
      var d = list[i];
      var burstPoint = d.is3d
        ? projectHeart3D(d.x3, d.y3, d.z3, now)
        : { x: d.tx, y: d.ty };
      var angle = Math.atan2(burstPoint.y - heart.cy, burstPoint.x - heart.cx) + (Math.random() - .5) * .7;
      makeParticle(burstPoint.x, burstPoint.y, {
        angle: angle,
        speed: 42 + Math.random() * 178,
        life: .55 + Math.random() * 1.02,
        size: .42 + Math.random() * 1.45,
        gravity: 32 + Math.random() * 40,
        drag: .976,
        color: d.color
      });
    }
  }

  function drawHeartReveal(elapsed, now) {
    var fadeIn = clamp((elapsed - 180) / 700, 0, 1);
    var pulse = heartPulse(now);
    drawPixelPig(now, .72 + Math.min(1, pulse) * .28);
    emitBaseStream(now, 1);
    drawAssemblies(current.assemblies, now, fadeIn);
    emitHeartWisps(now, .9);

    if (elapsed >= HEART_FORM_TIME) {
      explodeHeartAssemblies(current.assemblies, now);
      chaosUntil = now + 1250;
      for (var i = 0; i < 160; i++) emitChaos(now);
      phase = 'heartFinale';
      phaseStart = now;
    }
  }

  function drawHeartBurst(elapsed, now) {
    var k = clamp(elapsed / HEART_BURST_TIME, 0, 1);
    drawPixelPig(now, 1 - k * .28);
    emitBaseStream(now, .72);

    if (elapsed >= HEART_BURST_TIME) {
      var base = heartBasePoint();
      current = {
        kind: 'heart',
        assemblies: buildHeartAssemblies(base.x, base.y, now),
        startAt: now
      };
      phase = 'heartReform';
      phaseStart = now;
    }
  }

  function drawHeartReform(elapsed, now) {
    var fadeIn = clamp(elapsed / 820, 0, 1);
    drawPixelPig(now, .82);
    emitBaseStream(now, .86);
    drawAssemblies(current.assemblies, now, fadeIn);

    if (elapsed >= HEART_REFORM_TIME) {
      startRocket('message', 0, now);
    }
  }

  function drawMessageReveal(elapsed, now) {
    var fadeIn = clamp((elapsed - 250) / 450, 0, 1);
    var fadeOut = 1 - clamp((elapsed - 1350) / 550, 0, 1);
    var fade = Math.min(fadeIn, fadeOut);
    drawAssemblies(current.assemblies, now, fade);
    drawTextBlock(current.style, fade * .93);
    if (elapsed >= MESSAGE_LIFE) {
      if (messageIndex < messages.length - 1) {
        messageIndex++;
        startRocket('message', messageIndex, now);
      } else {
        current = null;
        phase = 'finished';
        phaseStart = now;
        startOutro(now);
      }
    }
  }

  function phaseName() {
    if (phase === 'heartLaunch') return 'HEART LAUNCH';
    if (phase === 'heartReveal') return 'HEART MORPH';
    if (phase === 'heartFinale') return 'HEART END';
    if (phase === 'heartBurst') return 'HEART BURST';
    if (phase === 'heartReform') return 'HEART REFORM';
    if (phase === 'messageLaunch') return 'TEXT LAUNCH';
    if (phase === 'messageReveal') return 'TEXT MORPH';
    if (phase === 'finished') return 'COMPLETE';
    return 'RENDER';
  }

  function updateCodeAtmosphere(now) {
    var rows = CODE_LINES.length;
    var totalHeight = codeAtmosphereTrack.scrollHeight;
    if (!totalHeight || !codeAtmosphere.clientHeight) return;
    var rowHeight = totalHeight / (rows * 4);
    var setHeight = rowHeight * rows;
    var elapsed = Math.max(0, now - codeStartedAt);
    var offset = Math.min(elapsed * .001 * 16, setHeight);
    codeAtmosphereTrack.style.transform = 'translate3d(0,' + (-offset) + 'px,0)';
  }

  function updateCodeWindow(now, dt) {
    var instantFps = dt > 0 ? 1 / dt : 60;
    smoothFps = smoothFps * .9 + instantFps * .1;
    updateRunningCode(now);
    monitorClock += dt;

    if (monitorClock < .095) return;
    monitorClock = 0;

    phaseLabel.textContent = phaseName();
    fpsLabel.textContent = Math.round(smoothFps) + ' FPS';
    particleLabel.textContent = particles.length + ' P';

    if (phase === 'finished') {
      terminalText.textContent = '> complete · executed once';
      return;
    }

    var runningSource = CODE_LINES[lastRunningLine] || 'render();';
    terminalText.textContent = '> ' + phase + ' · ' + runningSource.trim().slice(0, 42);
  }

  function drawHeartFinale(elapsed, now) {
    drawPixelPig(now, clamp(1 - elapsed / 1600, 0, 1) * .8);   // 爱心散场时小猪慢慢淡出
    if (now < chaosUntil) emitChaos(now);
    if (elapsed >= 1250) {
      var base = heartBasePoint();
      current = {
        kind: 'heart',
        assemblies: buildHeartAssemblies(base.x, base.y, now),
        startAt: now
      };
      phase = 'heartReform';
      phaseStart = now;
    }
  }

  function emitChaos(now) {
    var count = 5;
    for (var i = 0; i < count; i++) {
      if (Math.random() < .24) {
        var base = heartBasePoint();
        makeParticle(base.x + (Math.random() - .5) * heart.scale * 2.2, base.y + (Math.random() - .5) * 8, {
          angle: -Math.PI * .5 + (Math.random() - .5) * 1.15,
          speed: 24 + Math.random() * 85,
          life: .7 + Math.random() * 1.4,
          size: .35 + Math.random() * 1.5,
          gravity: 12 + Math.random() * 28,
          drag: .984,
          color: Math.random() < .25 ? PALETTE[3] : PALETTE[2]
        });
        continue;
      }

      var t = Math.random() * Math.PI * 2;
      var p = heartPoint(t);
      var dx = p.x - heart.cx;
      var dy = p.y - heart.cy;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var angle = Math.atan2(dy, dx) + (Math.random() - .5) * 1.4;
      var spread = .35 + Math.random() * .95;
      var px = heart.cx + dx * spread + (Math.random() - .5) * 8;
      var py = heart.cy + dy * spread + (Math.random() - .5) * 8;
      makeParticle(px, py, {
        angle: angle,
        speed: 18 + Math.random() * 155,
        life: .65 + Math.random() * 1.7,
        size: .26 + Math.random() * 1.75,
        gravity: 8 + Math.random() * 36,
        drag: .985,
        color: Math.random() < .24 ? PALETTE[3] : PALETTE[Math.random() < .5 ? 1 : 2]
      });
    }
  }

  /* ===== 背景音乐：Web Audio 实时合成的原创爵士圆舞曲（「爱乐之城」那种味道） =====
     旋律、和声都是这里原创的（ii–V–I 走向的爵士小调子），没有引用任何受版权保护的乐曲；
     也不用任何音频文件，页面仍然零外链、单文件可分享。
     浏览器要求「用户手势」才能出声，所以第一次点击/触摸/按键就会开始播放；
     右上角的 ♪ 按钮可以随时静音。想换成自己的歌：CONFIG.musicUrl 填 mp3 路径。 */
  var MUSIC_TEMPO = 96;        // 每分钟拍数（爵士圆舞曲，3/4 拍）
  var MUSIC_VOLUME = .42;      // 总音量（0~1）
  var MUSIC_PASSES = 2;        // 整段走几遍（第二遍更轻）
  var BEAT_SEC = 60 / MUSIC_TEMPO;
  var PITCH = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

  function hz(name) {
    var m = /^([A-G])(#|b)?(\d)$/.exec(name);
    if (!m) return 440;
    var semi = PITCH[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
    return 440 * Math.pow(2, (semi - 69) / 12);
  }

  /* 原创的「爱乐之城」味道爵士圆舞曲：
     钢琴主旋律 + 低音贝斯 + 刷子鼓（2、3 拍）+ 弦乐铺底，ii–V–I 走向，每句 3 拍一小节。 */
  var BARS = [
    { pad: ['C4', 'E4', 'G4', 'B4'], bass: 'C2', mel: [['G4', 1], ['A4', .5], ['B4', .5], ['E5', 1]] },
    { pad: ['A3', 'C4', 'E4', 'G4'], bass: 'A2', mel: [['C5', 1], ['B4', 1], ['A4', 1]] },
    { pad: ['D4', 'F4', 'A4', 'C5'], bass: 'D2', mel: [['A4', 1], ['F5', .5], ['E5', .5], ['D5', 1]] },
    { pad: ['G3', 'B3', 'D4', 'F4'], bass: 'G2', mel: [['D5', 1], ['C5', .5], ['B4', .5], ['G4', 1]] },
    { pad: ['C4', 'E4', 'G4', 'B4'], bass: 'C2', mel: [['E5', 1], ['G5', .5], ['E5', .5], ['C5', 1]] },
    { pad: ['F3', 'A3', 'C4', 'E4'], bass: 'F2', mel: [['A4', 1], ['C5', 1], ['E5', 1]] },
    { pad: ['G3', 'B3', 'D4', 'F4'], bass: 'G2', mel: [['D5', 1], ['B4', 1], ['G4', 1]] },
    { pad: ['C4', 'E4', 'G4', 'A4'], bass: 'C2', mel: [['C5', 3]] }
  ];

  var noiseBuffer = null;
  function makeNoiseBuffer(ctx) {
    if (noiseBuffer) return noiseBuffer;
    var len = Math.floor(ctx.sampleRate * .35);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    noiseBuffer = buf;
    return buf;
  }

  var music = { ctx: null, master: null, bus: null, started: false, muted: false, el: null, probing: false };
  var musicEnded = false;    // 音乐是否已放完（放完 → 画面跟着结束）
  var showStartAt = 0;
  var soundButton = document.getElementById('sound');
  var soundIcon = document.getElementById('sound-icon');
  var soundText = document.getElementById('sound-text');

  function musicBlocked() {
    if (!music.started) return true;
    if (music.el) return music.el.paused;
    return !!(music.ctx && music.ctx.state === 'suspended');
  }

  function updateSoundButton() {
    if (!soundButton) return;
    var blocked = musicBlocked();
    soundButton.classList.toggle('started', music.started && !blocked);
    soundButton.classList.toggle('off', music.muted);
    soundIcon.textContent = music.muted ? '✕' : '♪';
    soundText.textContent = music.muted ? '已静音' : (blocked ? '划一下开启音乐' : '音乐已开');
  }

  function buildReverb(ctx) {
    var len = Math.floor(ctx.sampleRate * 2.4);
    var ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
      var data = ir.getChannelData(ch);
      for (var i = 0; i < len; i++) {
        var k = 1 - i / len;
        data[i] = (Math.random() * 2 - 1) * k * k * k;
      }
    }
    var conv = ctx.createConvolver();
    conv.buffer = ir;
    return conv;
  }

  function pianoNote(ctx, dest, freq, at, beats, vel) {
    var dur = Math.max(.85, beats * BEAT_SEC * 1.05);
    var gain = ctx.createGain();
    var osc = ctx.createOscillator();
    var osc2 = ctx.createOscillator();
    var gain2 = ctx.createGain();
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(Math.min(5800, freq * 7), at);
    lp.frequency.exponentialRampToValueAtTime(Math.max(900, freq * 2.4), at + dur);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, at);
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(freq * 2.003, at);
    gain2.gain.value = .22;
    osc.connect(lp);
    lp.connect(gain);
    osc2.connect(gain2);
    gain2.connect(gain);
    gain.connect(dest);
    gain.gain.setValueAtTime(0, at);
    gain.gain.linearRampToValueAtTime(vel, at + .014);
    gain.gain.exponentialRampToValueAtTime(.0006, at + dur);
    osc.start(at);
    osc2.start(at);
    osc.stop(at + dur + .08);
    osc2.stop(at + dur + .08);
  }

  function bassNote(ctx, dest, freq, at, dur, vel) {
    var gain = ctx.createGain();
    var osc = ctx.createOscillator();
    var sub = ctx.createOscillator();
    var subGain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, at);
    sub.type = 'sine';
    sub.frequency.setValueAtTime(freq, at);
    subGain.gain.value = .5;
    osc.connect(gain);
    sub.connect(subGain);
    subGain.connect(gain);
    gain.connect(dest);
    gain.gain.setValueAtTime(0, at);
    gain.gain.linearRampToValueAtTime(vel, at + .022);
    gain.gain.exponentialRampToValueAtTime(.0008, at + dur);
    osc.start(at);
    sub.start(at);
    osc.stop(at + dur + .06);
    sub.stop(at + dur + .06);
  }

  function brushHit(ctx, dest, buffer, at, vel) {
    var src2 = ctx.createBufferSource();
    src2.buffer = buffer;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 5200;
    bp.Q.value = 1.1;
    var gain = ctx.createGain();
    src2.connect(bp);
    bp.connect(gain);
    gain.connect(dest);
    gain.gain.setValueAtTime(0, at);
    gain.gain.linearRampToValueAtTime(vel, at + .006);
    gain.gain.exponentialRampToValueAtTime(.0005, at + .22);
    src2.start(at);
    src2.stop(at + .34);
  }

  function thump(ctx, dest, at, vel) {
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, at);
    osc.frequency.exponentialRampToValueAtTime(52, at + .12);
    osc.connect(gain);
    gain.connect(dest);
    gain.gain.setValueAtTime(0, at);
    gain.gain.linearRampToValueAtTime(vel, at + .01);
    gain.gain.exponentialRampToValueAtTime(.0006, at + .28);
    osc.start(at);
    osc.stop(at + .32);
  }

  function padChord(ctx, dest, notes, at, beats, vel) {
    var dur = beats * BEAT_SEC;
    for (var i = 0; i < notes.length; i++) {
      var freq = hz(notes[i]);
      var gain = ctx.createGain();
      var osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, at);
      osc.detune.value = i % 2 ? 6 : -7;
      osc.connect(gain);
      gain.connect(dest);
      gain.gain.setValueAtTime(0, at);
      gain.gain.linearRampToValueAtTime(vel * (i === 0 ? 1.1 : .8), at + .75);
      gain.gain.setValueAtTime(vel * (i === 0 ? 1.1 : .8), at + Math.max(.8, dur - .3));
      gain.gain.linearRampToValueAtTime(0, at + dur + .9);
      osc.start(at);
      osc.stop(at + dur + 1.0);
    }
  }

  /* ---- 优先用你自己的音乐文件：CONFIG.musicUrl，或者同目录下这些文件名之一 ---- */
  var MUSIC_CANDIDATES = ['music.mp3', 'music.m4a', 'music.ogg'];

  function startFileMusic(url) {
    music.started = true;
    musicEnded = false;
    var el = new window.Audio(url);
    el.loop = false;                 // ← 只放一遍，保证完整播完
    el.volume = music.muted ? 0 : .55;
    music.el = el;
    el.addEventListener('ended', function () {   // ← 音乐放完 = 整场结束
      musicEnded = true;
      clearTimeout(loopTimer);
      endShowForGood();
    });
    var p = el.play();
    if (p && p.catch) p.catch(function () {});
    resyncShow();
  }

  /* 音乐结束后：渐隐到黑屏并停掉自动重播（点一下仍可手动重看） */
  function endShowForGood() {
    if (!outroStarted) startOutro(performance.now());
    clearTimeout(loopTimer);
    phase = 'finished';                 // 画面冻结，不再空转
    phaseStart = performance.now();
    current = null;
  }

  function startMusic() {
    if (music.started || music.probing) return;
    if (CONFIG.musicUrl) {
      startFileMusic(CONFIG.musicUrl);
      return;
    }
    if (!window.Audio && !window.AudioContext && !window.webkitAudioContext) return;
    /* 同目录里有没有放好的音乐文件？并行探一下，命中就用它，全都没命中才用合成曲 */
    music.probing = true;
    var pending = MUSIC_CANDIDATES.length;
    var settled = false;
    var finish = function (url) {
      if (settled) return;
      settled = true;
      music.probing = false;
      if (url) startFileMusic(url);
      else startSynthMusic();
    };
    MUSIC_CANDIDATES.forEach(function (url) {
      var probe = new window.Audio();
      var answered = false;
      var answer = function (hit) {
        if (settled || answered) return;
        answered = true;
        if (hit) {
          finish(url);
          return;
        }
        pending--;
        if (pending <= 0) finish(null);
      };
      probe.addEventListener('canplay', function () { answer(true); }, { once: true });
      probe.addEventListener('loadeddata', function () { answer(true); }, { once: true });
      probe.addEventListener('error', function () { answer(false); }, { once: true });
      setTimeout(function () { answer(false); }, 1100);
      probe.preload = 'auto';
      probe.src = url;
    });
  }

  function startSynthMusic() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    music.started = true;
    var ctx = music.ctx = new AC();
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    music.master = ctx.createGain();
    music.master.gain.value = 0;
    music.master.connect(ctx.destination);
    music.bus = ctx.createGain();
    music.bus.gain.value = 1;
    var dry = ctx.createGain();
    dry.gain.value = .86;
    var wet = ctx.createGain();
    wet.gain.value = .4;
    var conv = buildReverb(ctx);
    music.bus.connect(dry);
    dry.connect(music.master);
    music.bus.connect(conv);
    conv.connect(wet);
    wet.connect(music.master);

    var noise = makeNoiseBuffer(ctx);
    var startAt = ctx.currentTime + .18;
    var barLen = BEAT_SEC * 3;
    for (var pass = 0; pass < MUSIC_PASSES; pass++) {
      var passGain = pass === 0 ? 1 : .74;
      var passStart = startAt + pass * BARS.length * barLen;
      for (var b = 0; b < BARS.length; b++) {
        var bar = BARS[b];
        var at = passStart + b * barLen;
        padChord(ctx, music.bus, bar.pad, at, 3, .085 * passGain);
        bassNote(ctx, music.bus, hz(bar.bass), at, BEAT_SEC * 1.9, .17 * passGain);
        thump(ctx, music.bus, at, .12 * passGain);
        brushHit(ctx, music.bus, noise, at + BEAT_SEC, .05 * passGain);
        brushHit(ctx, music.bus, noise, at + BEAT_SEC * 2, .042 * passGain);
        var mt = at;
        for (var n = 0; n < bar.mel.length; n++) {
          pianoNote(ctx, music.bus, hz(bar.mel[n][0]), mt, bar.mel[n][1], .2 * passGain);
          mt += bar.mel[n][1] * BEAT_SEC;
        }
      }
    }
    music.master.gain.setValueAtTime(0, ctx.currentTime);
    music.master.gain.linearRampToValueAtTime(music.muted ? 0 : MUSIC_VOLUME, ctx.currentTime + 1.8);
    /* 合成曲总长约 30 秒：放完同样让画面结束 */
    var musicMs = (startAt - ctx.currentTime + BARS.length * barLen * MUSIC_PASSES) * 1000;
    setTimeout(function () { musicEnded = true; endShowForGood(); }, musicMs + 300);
    resyncShow();
  }

  /* 音乐如果晚于开场太多才响，就把整段动画重新开始，音乐和画面重新对齐 */
  function resyncShow() {
    var late = showStartAt && (performance.now() - showStartAt > 1500);
    if (late) {
      showStartAt = performance.now();
      restart(performance.now());
    }
    updateSoundButton();
  }

  function restartMusic() {
    if (music.el) {
      music.el.currentTime = 0;
      musicVolume(music.muted ? 0 : .55, .8);   // ← 把音量补回来，否则第二遍开始会没声
      var p = music.el.play();
      if (p && p.catch) p.catch(function () {});
      return;
    }
    if (music.ctx) {
      try { music.ctx.close(); } catch (e) {}
      music.ctx = null;
      music.master = null;
      music.bus = null;
      music.started = false;
      startSynthMusic();
    }
  }

  function musicVolume(to, seconds) {
    if (music.ctx && music.master) {
      var now = music.ctx.currentTime;
      music.master.gain.cancelScheduledValues(now);
      music.master.gain.setValueAtTime(music.master.gain.value, now);
      music.master.gain.linearRampToValueAtTime(to, now + seconds);
    }
    if (music.el) {
      var step = (to - music.el.volume) / Math.max(1, seconds * 30);
      var timer = setInterval(function () {
        var v = Math.min(1, Math.max(0, music.el.volume + step));
        music.el.volume = v;
        if (v <= 0 || v >= to) clearInterval(timer);
      }, 33);
    }
  }

  function toggleSound() {
    if (!music.started) {
      startMusic();
      if (music.ctx && music.ctx.state === 'suspended' && music.ctx.resume) music.ctx.resume();
      return;
    }
    music.muted = !music.muted;
    musicVolume(music.muted ? 0 : MUSIC_VOLUME, .35);
    updateSoundButton();
  }

  /* 自动播放：能自动就自动（Chrome 对本机地址/常访问的站点会放行，
     微信里靠 WeixinJSBridgeReady，都拦不住时——任何一次鼠标移动/点击/滚动/按键都会立刻接上） */
  function tryAutoplay() {
    if (!music.started) {
      startMusic();
      return;
    }
    if (music.el) {
      if (music.el.paused) {
        var p = music.el.play();
        if (p && p.catch) p.catch(function () {});
      }
      updateSoundButton();
      return;
    }
    if (music.ctx && music.ctx.state === 'suspended' && music.ctx.resume) {
      music.ctx.resume();
      updateSoundButton();
    }
  }

  function armMusic() {
    showStartAt = performance.now();
    if (!CONFIG.enableMusic) {
      if (soundButton) soundButton.style.display = 'none';
      return;
    }
    var kick = function () { tryAutoplay(); };
    ['pointerdown', 'pointerup', 'pointermove', 'pointerenter', 'mousedown', 'mouseup', 'mousemove',
      'mouseenter', 'click', 'dblclick', 'touchstart', 'touchend', 'touchmove', 'keydown', 'keyup',
      'wheel', 'scroll', 'dragstart', 'input', 'focus', 'focusin', 'blur', 'pageshow'
    ].forEach(function (ev) {
      window.addEventListener(ev, kick, { passive: true });
    });
    window.addEventListener('pointerdown', kick, { passive: true, capture: true });
    window.addEventListener('touchstart', kick, { passive: true, capture: true });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) kick();
    });
    document.addEventListener('WeixinJSBridgeReady', kick);
    if (window.WeixinJSBridge && window.WeixinJSBridge.invoke) {
      try { window.WeixinJSBridge.invoke('getNetworkType', {}, kick); } catch (e) {}
    }
    if (soundButton) {
      soundButton.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleSound();
      });
    }
    tryAutoplay();                       // 一加载就试
    setTimeout(tryAutoplay, 450);        // 再补两次，等浏览器把页面标成"已交互"
    setTimeout(tryAutoplay, 1500);
    updateSoundButton();
  }

  var loopTimer = 0;
  function replayShow() {
    if (phase !== 'finished') return;
    if (musicEnded) return;          // 音乐已放完 → 不再自动重播
    showStartAt = performance.now();
    restart(performance.now());      // 只重播画面，音乐保持连续播放，绝不归零
  }

  function startOutro(now) {
    if (outroStarted) return;
    outroStarted = true;
    /* 注意：这里不碰音乐 —— 画面循环的黑屏只是过场，音频必须连续放完 */
    if (CONFIG.loop) {
      clearTimeout(loopTimer);                     // 黑屏停一下，再自动重播
      loopTimer = setTimeout(function () { replayShow(); }, 5000);
    }
    codeAtmosphereTrack.classList.add('finish');
    codeAtmosphere.classList.add('finish');
    blackout.classList.add('active');
  }

  function restart(now) {
    particles.length = 0;
    current = null;
    rocket = null;
    messageIndex = 0;
    lastRunningLine = 0;
    lastBaseEmit = 0;
    lastWispEmit = 0;
    chaosUntil = 0;
    outroStarted = false;
    blackout.classList.remove('active');
    codeAtmosphere.classList.remove('finish');
    codeAtmosphereTrack.classList.remove('finish');
    codeStartedAt = now;
    codeAtmosphereTrack.style.transform = 'translate3d(0,0,0)';
    terminalText.textContent = '> canvas.init()';
    ctx.clearRect(0, 0, w, h);
    tctx.clearRect(0, 0, w, h);
    tctx.globalCompositeOperation = 'lighter';
    updateVortices(now);
    startRocket('heart', 0, now);
  }

  function frame(now) {
    var dt = Math.min((now - lastTime) / 1000 || .016, .034);
    lastTime = now;
    var elapsed = now - phaseStart;

    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,.145)';
    ctx.fillRect(0, 0, w, h);
    ctx.restore();

    updateVortices(now);
    trailDecay = trailDecayFor(phase, elapsed);
    fadeTrail();
    drawParticles(dt, now);
    if (phase === 'finished' && now < chaosUntil) emitChaos(now);

    if (phase === 'heartLaunch') {
      drawPixelPig(now, .42);
      emitBaseStream(now, .55);
      updateRocket(dt, now);
    } else if (phase === 'messageLaunch') {
      updateRocket(dt, now);
    } else if (phase === 'heartReveal') {
      drawHeartReveal(elapsed, now);
    } else if (phase === 'heartBurst') {
      drawHeartBurst(elapsed, now);
    } else if (phase === 'heartReform') {
      drawHeartReform(elapsed, now);
    } else if (phase === 'heartFinale') {
      drawHeartFinale(elapsed, now);
    } else if (phase === 'messageReveal') {
      drawMessageReveal(elapsed, now);
    }

    if (phase === 'heartLaunch' || phase === 'heartReveal' || phase === 'heartBurst' || phase === 'heartReform') {
      clearTrailBase();
    }

    updateCodeAtmosphere(now);
    updateCodeWindow(now, dt);
    requestAnimationFrame(frame);
  }

  window.addEventListener('pointerdown', function () {
    if (phase === 'finished') {                // 黑屏时点一下 = 手动重看（音乐也从头再来）
      musicEnded = false;
      replayShow();
    }
  }, { passive: true });
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); }, { passive: true });
  buildCodeAtmosphere();
  buildCodeViewer();
  armMusic();
  resize();
  lastTime = performance.now();
  requestAnimationFrame(frame);
})();
  // 1314 lines · 一生一世
  // 保持这个文件的浪漫行数
</script>
</body>
</html>
